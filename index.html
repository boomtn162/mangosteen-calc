<style>
  :root{
    --bg:#FAF6F0;
    --card:#FFFFFF;
    --ink:#2B1B2E;
    --ink-soft:#6B5C6C;
    --primary:#5C2A4A;
    --primary-dark:#3E1A33;
    --accent:#6B8E4E;
    --accent-gold:#D98C3B;
    --border:#E4DCD3;
    --danger:#B03A2E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Sarabun',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

  header.top{
    background:var(--primary); color:#fff;
    padding:18px 16px 40px;
    position:relative;
  }
  header.top .brand{ display:flex; align-items:center; gap:10px; }
  header.top .mark{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #9C5580, var(--primary-dark));
    display:flex;align-items:center;justify-content:center;
    font-size:18px; flex-shrink:0;
    box-shadow:0 0 0 3px rgba(255,255,255,0.15);
  }
  header.top h1{ font-size:17px; margin:0; font-weight:700; letter-spacing:.2px; }
  header.top p{ margin:2px 0 0; font-size:12px; opacity:.85; }

  .torn{
    height:12px; margin-top:-1px;
    background:
      linear-gradient(-45deg, transparent 6px, var(--bg) 6px),
      linear-gradient(45deg, transparent 6px, var(--bg) 6px);
    background-size:12px 12px; background-repeat:repeat-x; background-position:bottom;
  }

  nav.tabs{
    display:flex; gap:6px; margin:-28px 12px 14px; position:relative; z-index:2;
    background:var(--card); border-radius:12px; padding:5px;
    box-shadow:0 6px 18px rgba(60,20,45,0.15);
  }
  nav.tabs button{
    flex:1; border:none; background:transparent; padding:10px 4px;
    font-family:'Sarabun',sans-serif; font-size:13px; font-weight:600;
    color:var(--ink-soft); border-radius:9px; cursor:pointer;
  }
  nav.tabs button.active{ background:var(--primary); color:#fff; }

  main{ padding:0 12px; max-width:520px; margin:0 auto; }

  .card{
    background:var(--card); border-radius:var(--radius);
    border:1px solid var(--border);
    padding:14px; margin-bottom:12px;
  }
  .card h2{ font-size:14px; margin:0 0 10px; color:var(--primary-dark); font-weight:700; }
  label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; font-weight:600; }
  input[type=text], input[type=number], input[type=date], input[type=month]{
    width:100%; padding:10px 11px; border:1.5px solid var(--border); border-radius:9px;
    font-family:inherit; font-size:15px; background:#fff; color:var(--ink);
  }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, input[type=month]:focus{
    outline:none; border-color:var(--primary);
  }
  input[type=date], input[type=month]{
    padding:8px 9px; font-size:13.5px; max-width:180px;
  }
  .field{ margin-bottom:10px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .grade-row{ border-top:1px dashed var(--border); padding:12px 0; }
  .grade-row:first-child{ border-top:none; padding-top:0; }
  .grade-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .grade-head .gname{ font-weight:700; font-size:14.5px; color:var(--ink); }
  .grade-head .gname .tag{
    font-size:10.5px; color:var(--accent); font-weight:600; margin-left:6px;
  }
  .price-inline{ display:flex; align-items:center; gap:6px; }
  .price-inline input{ width:78px; padding:6px 8px; font-size:14px; }
  .price-inline span{ font-size:12px; color:var(--ink-soft); }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .chip{
    background:#F3E9EE; color:var(--primary-dark); border-radius:20px;
    padding:5px 6px 5px 12px; font-size:13px; display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace;
  }
  .chip button{
    border:none; background:var(--primary-dark); color:#fff; width:18px; height:18px;
    border-radius:50%; font-size:11px; line-height:1; cursor:pointer;
  }
  .entry-add{ display:flex; gap:6px; }
  .entry-add input{ flex:1; }
  .entry-add button{
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    padding:0 14px; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .grade-foot{ display:flex; justify-content:space-between; margin-top:8px; font-size:13px; color:var(--ink-soft); }
  .grade-foot b{ color:var(--ink); font-family:'JetBrains Mono',monospace; }

  .summary-card{ background:var(--primary); color:#fff; }
  .summary-card h2{ color:#fff; opacity:.9; }
  .srow{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:14px; }
  .srow.fee input{
    width:60px; padding:5px 7px; font-size:13px; text-align:center;
    border-radius:7px; border:none;
  }

  /* Detail / print */
  .detail-back{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<body>
<div id="app"></div>
<div id="print-area"></div>

<script>
/* ---------------- State & storage ---------------- */
// Pre-configured Google Sheets backend - the app connects automatically on first load
// of any device, no need to paste the link manually. Users can still change/clear it in Settings.
const DEFAULT_CLOUD_URL = 'https://script.google.com/macros/s/AKfycbyS30NJofUexxXUWqSKladMO3Z4oww45KNftfelltrswFm0s_XvJFLNfr1uFxJJATe5/exec';

const state = { tab:'new', config:null, receipts:[], draft:null, viewId:null, historyMode:'list', search:'', reportDate:todayLocalISO(), reportMonth:todayLocalMonth(), selectMode:false, selectedIds:[], showDateFilter:false, filterFrom:'', filterTo:'', cloudUrl:'', cloudStatus:'idle' };

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// window.storage only exists inside Claude.ai's artifact viewer. When this file is opened
// directly (downloaded, or added to the home screen for daily use), it's undefined and every
// save silently fails - nothing persists between opens. Fall back to real localStorage so the
// app works reliably as a standalone page too.
const _hasCloudArtifactStorage = (typeof window.storage !== 'undefined' && window.storage);
async function storageGet(key){
  if(_hasCloudArtifactStorage){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(_hasCloudArtifactStorage){
    try{ await window.storage.set(key, value, false); return; }
    catch(e){ console.error('artifact storage set failed', e); }
    return;
  }
  try{ localStorage.setItem(key, value); }catch(e){ console.error('localStorage set failed', e); }
}

// toISOString() returns the UTC date, which is wrong for Thailand (UTC+7) during
// early morning hours (00:00-06:59 local is still "yesterday" in UTC). Use local
// date parts instead so today's date is always correct regardless of time of day.
function todayLocalISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayLocalMonth(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

const PRESET_MEMBER_NAMES = ["อดใจ","ละออ","มุกดา","กาญจนา","เจษฎาพร","สมศรี","สาว","ประคอง","อุไร","อุบล","สายชล","ประนอม","อำนวย","เรืองฤทธิ์","สุพัตรา","ภักดี","ไพศาล","อัญชลี","วิภาวดี","เมทยา","นิรชา","เยาวรัตน์"];

function defaultConfig(){
  return {
    groupName:'กลุ่มบูมมังคุดคุณภาพ',
    groupAddr:'ม.4 ต.เกาะขันธ์ อ.ชะอวด จ.นครศรีธรรมราช',
    groupPhone:'089-879-9939',
    feePerKg:2,
    nextReceiptNo:1,
    memberNames:PRESET_MEMBER_NAMES.slice(),
    grades:[
      {id:uid(), name:'เบอร์ 1', price:0},
      {id:uid(), name:'เบอร์ 2', price:0},
      {id:uid(), name:'เบอร์ 3', price:0},
      {id:uid(), name:'เบอร์ 4', price:0},
      {id:uid(), name:'เบอร์ดำ', price:0},
      {id:uid(), name:'เบอร์มันลาย', price:0},
      {id:uid(), name:'เบอร์กากใหญ่', price:0},
    ]
  };
}

async function loadData(){
  try{
    const u = await storageGet('pos-cloud-url');
    state.cloudUrl = (u!==null && u!==undefined) ? u : DEFAULT_CLOUD_URL;
    if(u===null || u===undefined) await storageSet('pos-cloud-url', state.cloudUrl); // persist the default so it's explicit from now on
  }catch(e){ state.cloudUrl = DEFAULT_CLOUD_URL; }
  try{
    const c = await storageGet('pos-config');
    state.config = c ? JSON.parse(c) : defaultConfig();
  }catch(e){ state.config = defaultConfig(); }
  try{
    const r = await storageGet('pos-receipts');
    state.receipts = r ? JSON.parse(r) : [];
  }catch(e){ state.receipts = []; }
  const needsSave = migrateData();
  if(needsSave.config) await saveConfig();
  if(needsSave.receipts) await saveReceiptsList();
  resetDraft();
  render();
  if(state.cloudUrl) syncFromCloud();
}

/* ---------------- Cloud sync (Google Sheets via Apps Script) ---------------- */
async function cloudGet(action){
  const res = await fetch(state.cloudUrl+'?action='+action, {method:'GET'});
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}
async function cloudPost(payload){
  const res = await fetch(state.cloudUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight, which Apps Script doesn't handle
    body:JSON.stringify(payload)
  });
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

async function syncFromCloud(){
  if(!state.cloudUrl) return;
  state.cloudStatus = 'syncing';
  render();
  try{
    const [cloudConfig, cloudReceipts] = await Promise.all([cloudGet('getConfig'), cloudGet('getReceipts')]);
    if(cloudConfig && Object.keys(cloudConfig).length){
      state.config = {...state.config, ...cloudConfig};
      await saveConfig();
    } else if(Object.keys(state.config).length){
      // sheet is empty (first-time setup) - push our current local config up
      await cloudPost({action:'saveConfig', config:state.config});
    }
    if(Array.isArray(cloudReceipts)){
      state.receipts = cloudReceipts;
      await saveReceiptsList();
    }
    const needsSave = migrateData();
    if(needsSave.config) await saveConfig();
    if(needsSave.receipts) await saveReceiptsList();
    resetDraft();
    state.cloudStatus = 'connected';
  }catch(e){
    console.error('cloud sync failed', e);
    state.cloudStatus = 'error';
  }
  render();
}

let _cloudConfigDebounce = null;
function pushConfigToCloudDebounced(){
  if(!state.cloudUrl) return;
  if(_cloudConfigDebounce) clearTimeout(_cloudConfigDebounce);
  _cloudConfigDebounce = setTimeout(async ()=>{
    try{ await cloudPost({action:'saveConfig', config:state.config}); state.cloudStatus='connected'; }
    catch(e){ console.error('cloud config push failed', e); state.cloudStatus='error'; showToastTemp('บันทึกตั้งค่าขึ้น Google Sheets ไม่สำเร็จ (บันทึกในเครื่องแล้ว)'); }
  }, 800);
}

function migrateData(){
  let configChanged=false, receiptsChanged=false;
  if(state.config.nextReceiptNo===undefined){ state.config.nextReceiptNo=1; configChanged=true; }
  if(state.config.memberNames===undefined){ state.config.memberNames = PRESET_MEMBER_NAMES.slice(); configChanged=true; }
  state.config.grades.forEach(g=>{
    if(g.price===undefined){ g.price = g.lastPrice!==undefined? g.lastPrice : 0; configChanged=true; }
    if(g.lastPrice!==undefined){ delete g.lastPrice; configChanged=true; }
  });
  const sorted = state.receipts.slice().sort((a,b)=>a.createdAt-b.createdAt);
  let maxNo=0;
  sorted.forEach(r=>{ if(r.receiptNo && r.receiptNo>maxNo) maxNo=r.receiptNo; });
  let counter=maxNo;
  sorted.forEach(r=>{ if(!r.receiptNo){ counter++; r.receiptNo=counter; receiptsChanged=true; } });
  if(counter+1>state.config.nextReceiptNo){ state.config.nextReceiptNo=counter+1; configChanged=true; }
  return {config:configChanged, receipts:receiptsChanged};
}
async function saveConfig(){
  try{ await storageSet('pos-config', JSON.stringify(state.config)); }
  catch(e){ console.error('save config failed', e); }
  pushConfigToCloudDebounced();
}
async function saveReceiptsList(){
  try{ await storageSet('pos-receipts', JSON.stringify(state.receipts)); }
  catch(e){ console.error('save receipts failed', e); }
}
async function saveCloudUrl(url){
  state.cloudUrl = (url||'').trim();
  try{ await storageSet('pos-cloud-url', state.cloudUrl); }
  catch(e){ console.error('save cloud url failed', e); }
}

function resetDraft(){
  state.draft = {
    ownerName:'',
    date:todayLocalISO(),
    feePerKg:state.config.feePerKg,
    grades:state.config.grades.map(g=>({gradeId:g.id, name:g.name, entries:[]}))
  };
}

/* ---------------- Calculations ---------------- */
function getGradePrice(gradeId){
  const g = state.config.grades.find(x=>x.id===gradeId);
  return g ? (g.price||0) : 0;
}
function gradeWeight(dg){ return dg.entries.reduce((s,w)=>s+w,0); }
function gradeAmount(dg){ return Math.round(gradeWeight(dg)*getGradePrice(dg.gradeId)); }
function draftTotals(d){
  let totalWeight=0, totalAmount=0;
  d.grades.forEach(dg=>{ totalWeight+=gradeWeight(dg); totalAmount+=gradeAmount(dg); });
  const fee = Math.floor(totalWeight*(d.feePerKg||0));
  const net = totalAmount - fee;
  return {totalWeight, totalAmount, fee, net};
}

const THAI_MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function formatThaiDate(iso){
  const d = new Date(iso+'T00:00:00');
  const day = d.getDate();
  const month = THAI_MONTHS[d.getMonth()];
  const yearBE = d.getFullYear()+543;
  return day+' '+month+' '+yearBE;
}
function fmtNum(n){ return (Math.round(n*100)/100).toLocaleString('th-TH'); }
function formatReceiptNo(n){ return '#'+String(n||0).padStart(4,'0'); }
function formatThaiMonth(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  return THAI_MONTHS[m-1]+' '+(y+543);
}

/* ---------------- Render ---------------- */
function render(){
  const app=document.getElementById('app');
  app.innerHTML = renderHeader() + '<main>' + (
    state.tab==='new' ? renderNew() :
    state.tab==='settings' ? renderSettings() :
    state.tab==='history' ? renderHistory() :
    state.tab==='detail' ? renderDetail() : ''
  ) + '</main>';
}

function renderHeader(){
  const tabs=[['new','บันทึกใบเสร็จ'],['history','ประวัติ/รายงาน'],['settings','ตั้งค่า']];
  return `
  <header class="top">
    <div class="brand">
      <div class="mark">🟣</div>
      <div>
        <h1>${state.config.groupName}</h1>
        <p>${state.config.groupAddr} • โทร ${state.config.groupPhone}</p>
      </div>
    </div>
  </header>
  <div class="torn"></div>
  <nav class="tabs">
    ${tabs.map(([id,label])=>`<button data-action="tab" data-tab="${id}" class="${state.tab===id||(state.tab==='detail'&&id==='history')?'active':''}">${label}</button>`).join('')}
  </nav>`;
}

function renderNew(){
  const d = state.draft;
  const t = draftTotals(d);
  const owners = [...new Set([...(state.config.memberNames||[]), ...state.receipts.map(r=>r.ownerName)])].sort((a,b)=>a.localeCompare(b,'th'));
  return `
  ${d.editingId? `
  <div class="card" style="background:#FFF6E9;border-color:var(--accent-gold);">
    <b style="color:var(--primary-dark);">กำลังแก้ไขใบเสร็จ ${formatReceiptNo(d.editingReceiptNo)}</b>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">แก้ไขข้อมูลด้านล่างแล้วกด "บันทึกการแก้ไข"</div>
  </div>` : ''}
  <div class="card">
    <h2>ข้อมูลใบเสร็จ</h2>
    <div class="row2">
      <div class="field">
        <label>ชื่อเจ้าของสวน</label>
        <input list="owners" type="text" data-field="ownerName" value="${escapeAttr(d.ownerName)}" placeholder="ชื่อ-สกุล">
        <datalist id="owners">${owners.map(o=>`<option value="${escapeAttr(o)}">`).join('')}</datalist>
      </div>
      <div class="field">
        <label>วันที่</label>
        <input type="date" data-field="date" value="${d.date}">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>รายละเอียด (กก.) แต่ละเบอร์</h2>
    ${d.grades.map(dg=>{
      const w = gradeWeight(dg), amt = gradeAmount(dg), price = getGradePrice(dg.gradeId);
      return `
      <div class="grade-row" data-grade="${dg.gradeId}">
        <div class="grade-head">
          <div class="gname">${dg.name}${w>0?`<span class="tag">${fmtNum(w)} กก.</span>`:''}</div>
          <div class="price-inline">
            ${price>0
              ? `<span>ราคา</span><b class="num">${fmtNum(price)}</b><span>บ./กก.</span>`
              : `<button type="button" data-action="tab" data-tab="settings" style="background:none;border:1px solid var(--accent-gold);color:var(--accent-gold);border-radius:7px;padding:4px 8px;font-size:11.5px;font-weight:700;cursor:pointer;">ยังไม่ตั้งราคา · ไปตั้งค่า</button>`}
          </div>
        </div>
        <div class="chips">
          ${dg.entries.map((val,idx)=>`<span class="chip">${fmtNum(val)}<button data-action="rmEntry" data-grade="${dg.gradeId}" data-idx="${idx}">×</button></span>`).join('')}
        </div>
        <div class="entry-add">
          <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="ชั่งน้ำหนัก (กก.)" data-entry-input="${dg.gradeId}">
          <button data-action="addEntry" data-grade="${dg.gradeId}">+ เพิ่ม</button>
        </div>
        <div class="grade-foot">
          <span>รวมน้ำหนัก <b class="num">${fmtNum(w)}</b> กก.</span>
          <span>จำนวนเงิน <b class="num">${fmtNum(amt)}</b> บาท</span>
        </div>
      </div>`;
    }).join('')}
  </div>

  <div class="card summary-card">
    <h2>สรุปยอด</h2>
    <div class="srow"><span>น้ำหนักรวม</span><span class="val num">${fmtNum(t.totalWeight)} กก.</span></div>
    <div class="srow"><span>รวมเงิน</span><span class="val num">${fmtNum(t.totalAmount)} บาท</span></div>
    <div class="srow fee"><span>หักค่าบริการ กก.ละ <input type="number" step="0.01" min="0" data-field="feePerKg" value="${d.feePerKg}"> บาท</span><span class="val num">${fmtNum(t.fee)} บาท</span></div>
    <div class="srow net"><span>รวมเงินทั้งหมด</span><span class="val num">${fmtNum(t.net)} บาท</span></div>
  </div>

  <div class="actions">
    ${d.editingId? `
      <button class="btn ghost" data-action="cancelEdit">ยกเลิกการแก้ไข</button>
      <button class="btn primary" data-action="saveReceipt">บันทึกการแก้ไข</button>
    ` : `
      <button class="btn ghost" data-action="clearDraft">ล้างข้อมูล</button>
      <button class="btn primary" data-action="saveReceipt">บันทึก &amp; พิมพ์</button>
    `}
  </div>`;
}

function renderSettings(){
  const c = state.config;
  const statusLabel = {
    idle: state.cloudUrl? '⏸ ยังไม่ซิงค์' : '⚪ ยังไม่ได้เชื่อมต่อ',
    syncing: '🔄 กำลังซิงค์...',
    connected: '🟢 เชื่อมต่อแล้ว ข้อมูลซิงค์กับ Google Sheets',
    error: '🔴 เชื่อมต่อไม่สำเร็จ ตรวจสอบลิงก์อีกครั้ง'
  }[state.cloudStatus] || '';
  return `
  <div class="card">
    <h2>เชื่อมต่อฐานข้อมูล Google Sheets</h2>
    <p style="font-size:12px;color:var(--ink-soft);margin:-4px 0 10px;">วางลิงก์ Web App จาก Google Apps Script ที่นี่ เพื่อให้ข้อมูลของกลุ่มซิงค์ขึ้น Google Sheets และใช้งานร่วมกันได้หลายเครื่อง (ดูวิธีตั้งค่าในไฟล์ google-sheets-backend.gs.txt ที่ให้ไว้)</p>
    <div class="field"><label>Web App URL</label><input type="text" id="cloudUrlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeAttr(state.cloudUrl)}"></div>
    <div class="actions" style="margin:6px 0 0;">
      <button class="btn ghost" data-action="saveCloudUrl">บันทึกลิงก์</button>
      <button class="btn primary" data-action="syncNow">ซิงค์ตอนนี้</button>
    </div>
    ${state.cloudUrl? `<p style="font-size:12.5px;margin:10px 0 0;color:var(--ink-soft);">${statusLabel}</p>` : ''}

function getFilteredReceiptList(){
  const q = state.search.trim().toLowerCase();
  let list = state.receipts.slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(q){
    list = list.filter(r=>{
      const nameMatch = r.ownerName.toLowerCase().includes(q);
      const noMatch = formatReceiptNo(r.receiptNo).toLowerCase().includes(q) || String(r.receiptNo||'').includes(q);
      return nameMatch || noMatch;
    });
  }
  if(state.filterFrom) list = list.filter(r=>r.date >= state.filterFrom);
  if(state.filterTo) list = list.filter(r=>r.date <= state.filterTo);
  return list;
}

function computeDaily(dateStr){
  const receipts = state.receipts.filter(r=>r.date===dateStr).sort((a,b)=>a.createdAt-b.createdAt);
  const gradeTotals = {};
  let totalWeight=0, totalAmount=0, totalFee=0, totalNet=0;
  receipts.forEach(r=>{
    totalWeight+=r.totalWeight; totalAmount+=r.totalAmount; totalFee+=r.fee; totalNet+=r.net;
    r.grades.forEach(g=>{
      if(g.weight<=0) return;
      if(!gradeTotals[g.name]) gradeTotals[g.name]={weight:0, amount:0};
      gradeTotals[g.name].weight+=g.weight; gradeTotals[g.name].amount+=g.amount;
    });
  });
  return {receipts, gradeTotals, totalWeight, totalAmount, totalFee, totalNet};
}

function computeMonthly(monthStr){
  const receipts = state.receipts.filter(r=>r.date.startsWith(monthStr)).sort((a,b)=>a.createdAt-b.createdAt);
  const gradeTotals = {};
  const ownerTotals = {};
  let totalWeight=0, totalAmount=0, totalFee=0, totalNet=0;
  receipts.forEach(r=>{
    totalWeight+=r.totalWeight; totalAmount+=r.totalAmount; totalFee+=r.fee; totalNet+=r.net;
    if(!ownerTotals[r.ownerName]) ownerTotals[r.ownerName]={name:r.ownerName, count:0, weight:0, net:0};
    ownerTotals[r.ownerName].count++; ownerTotals[r.ownerName].weight+=r.totalWeight; ownerTotals[r.ownerName].net+=r.net;
    r.grades.forEach(g=>{
      if(g.weight<=0) return;
      if(!gradeTotals[g.name]) gradeTotals[g.name]={weight:0, amount:0};
      gradeTotals[g.name].weight+=g.weight; gradeTotals[g.name].amount+=g.amount;
    });
  });
  return {receipts, gradeTotals, ownerTotals, totalWeight, totalAmount, totalFee, totalNet};
}

function escapeAttr(s){ return escapeHtml(s); }

function setPageStyle(css){

}

function doPrint(r){
  prepareThermalPrint();
  document.getElementById('print-area').innerHTML = buildPrintHtml(r);
  // Call print() synchronously, not via setTimeout: iOS Safari only honors
  // window.print() when it runs directly inside the user's tap - deferring it
  // even by a few ms drops the "user activation" and silently blocks the
  // print sheet from opening (no error, it just does nothing).
  window.print();
}

function shareReceipt(r){
  if(typeof html2canvas==='undefined'){ alert('ไม่สามารถโหลดตัวช่วยสร้างรูปได้ ลองเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่'); return; }
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:fixed;left:-9999px;top:0;width:320px;background:#ffffff;padding:16px;font-family:Sarabun,sans-serif;color:#000;';
  wrapper.innerHTML = buildPrintHtml(r);
  document.body.appendChild(wrapper);
  html2canvas(wrapper, {backgroundColor:'#ffffff', scale:2}).then(canvas=>{
    canvas.toBlob(async (blob)=>{
      document.body.removeChild(wrapper);
      if(!blob){ alert('ไม่สามารถสร้างรูปใบเสร็จได้'); return; }
      const fileName = `receipt-${formatReceiptNo(r.receiptNo)}.png`;
      const file = new File([blob], fileName, {type:'image/png'});
      if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
        try{
          await navigator.share({files:[file], title:'ใบเสร็จ '+formatReceiptNo(r.receiptNo), text:`ใบเสร็จ ${formatReceiptNo(r.receiptNo)} - ${r.ownerName}`});
          return;
        }catch(e){ /* user cancelled the share sheet, or share failed - fall through to download */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  }).catch(()=>{
    if(wrapper.parentNode) document.body.removeChild(wrapper);
    alert('ไม่สามารถสร้างรูปใบเสร็จได้ ลองอีกครั้ง');
  });
}

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display = 'block';
}
function hideToast(){
  const t = document.getElementById('toast');
  if(t) t.style.display = 'none';
}
let _toastTimer = null;
function showToastTemp(msg, ms){
  showToast(msg);
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(hideToast, ms||3200);
}

// Scales a receipt's content down (never up) so it fits entirely within its slip/cell area,
// measured live in the real DOM so font metrics are accurate.
function fitInnerToCell(cell, inner){
  const naturalH = inner.getBoundingClientRect().height;
  const cs = getComputedStyle(cell);
  const availH = cell.getBoundingClientRect().height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if(naturalH<=availH) return;
  const scale = Math.max(availH/naturalH, 0.35); // never shrink past 35% (stays legible)
  inner.style.transform = `scale(${scale.toFixed(3)})`;
}

function buildA4PageForCapture(pageReceipts){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed; left:-99999px; top:0; width:210mm; height:297mm; box-sizing:border-box; padding:10mm; background:#fff; font-family:Sarabun,sans-serif; color:#000;';
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:138.5mm; width:100%; height:100%;';
  const pairs = [];
  pageReceipts.forEach(r=>{
    const cell = document.createElement('div');
    cell.style.cssText = 'border:1px dashed #888; box-sizing:border-box; padding:6mm; overflow:hidden; position:relative;';
    const inner = document.createElement('div');
    inner.style.transformOrigin = 'top left';
    inner.innerHTML = buildPrintHtml(r);
    cell.appendChild(inner);
    grid.appendChild(cell);
    pairs.push([cell, inner]);
  });
  wrap.appendChild(grid);
  document.body.appendChild(wrap);
  pairs.forEach(([cell, inner])=>fitInnerToCell(cell, inner));
  return wrap;
}

async function doPrintSelectedA4(ids){
  if(!ids || !ids.length){ alert('กรุณาเลือกใบเสร็จอย่างน้อย 1 รายการ'); return; }
  const receipts = ids.map(id=>state.receipts.find(x=>x.id===id)).filter(Boolean);
  if(!receipts.length){ alert('ไม่พบใบเสร็จที่เลือก'); return; }
  if(typeof html2canvas==='undefined'){ alert('ไม่สามารถโหลดตัวช่วยจัดพิมพ์ได้ ลองเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่'); return; }

  const pages = [];
  for(let i=0;i<receipts.length;i+=4){ pages.push(receipts.slice(i,i+4)); }

  showToast(`กำลังจัดหน้าเอกสาร (0/${pages.length})...`);
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }

  const images = [];
  try{
    for(let i=0;i<pages.length;i++){
      showToast(`กำลังจัดหน้าเอกสาร (${i+1}/${pages.length})...`);
      const pageEl = buildA4PageForCapture(pages[i]);
      await new Promise(res=>requestAnimationFrame(()=>requestAnimationFrame(res)));
      const canvas = await html2canvas(pageEl, {scale:2, backgroundColor:'#ffffff'});
      document.body.removeChild(pageEl);
      images.push(canvas.toDataURL('image/png'));
    }
  }catch(e){
    hideToast();
    alert('ไม่สามารถจัดหน้าเอกสารได้ ลองอีกครั้ง');
    return;
  }

  setPageStyle('@page{ size:A4; margin:0; }');
  const area = document.getElementById('print-area');
  area.classList.add('mode-a4');
  area.innerHTML = images.map((src,idx)=>`<img class="a4-page-img" src="${src}" style="page-break-after:${idx<images.length-1?'always':'auto'};">`).join('');
  hideToast();
  window.print();
}

function exportMonthlyCsv(monthStr){
  const rep = computeMonthly(monthStr);
  const owners = Object.values(rep.ownerTotals).sort((a,b)=>b.net-a.net);
  if(!owners.length){ alert('ไม่มีข้อมูลของเดือนนี้'); return; }
  let csv = 'สรุปรายบุคคล\n';
  csv += 'ชื่อเจ้าของสวน,จำนวนครั้ง,น้ำหนักรวม(กก.),สุทธิรวม(บาท)\n';
  owners.forEach(m=>{
    csv += `"${m.name.replace(/"/g,'""')}",${m.count},${m.weight},${m.net}\n`;
  });
  csv += `รวมทั้งเดือน,${rep.receipts.length},${rep.totalWeight},${rep.totalNet}\n`;

  csv += '\nสรุปตามเบอร์\n';
  csv += 'เบอร์,น้ำหนักรวม(กก.),จำนวนเงิน(บาท)\n';
  Object.keys(rep.gradeTotals).forEach(name=>{
    const g = rep.gradeTotals[name];
    csv += `"${name.replace(/"/g,'""')}",${g.weight},${g.amount}\n`;
  });
  const gradeWeightSum = Object.values(rep.gradeTotals).reduce((s,g)=>s+g.weight,0);
  const gradeAmountSum = Object.values(rep.gradeTotals).reduce((s,g)=>s+g.amount,0);
  csv += `รวม,${gradeWeightSum},${gradeAmountSum}\n`;

  try{
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `รายงานเดือน-${monthStr}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ alert('ไม่สามารถดาวน์โหลดไฟล์ในอุปกรณ์นี้ได้ ลองใช้ปุ่มพิมพ์รายงานแทน'); }
}

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = todayLocalISO();
    a.href = url; a.download = `pos-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ alert('ไม่สามารถดาวน์โหลดไฟล์สำรองในอุปกรณ์นี้ได้'); }
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.config || !Array.isArray(data.receipts)) throw new Error('invalid');
      if(!confirm('นำเข้าข้อมูลจะเขียนทับข้อมูลปัจจุบันทั้งหมดในเครื่องนี้ ยืนยันหรือไม่?')) return;
      state.config = data.config;
      state.receipts = data.receipts;
      migrateData();
      await saveConfig();
      await saveReceiptsList();
      resetDraft();
      alert('นำเข้าข้อมูลสำเร็จ');
      render();
    }catch(err){ alert('ไฟล์ไม่ถูกต้อง ไม่สามารถนำเข้าได้'); }
  };
  reader.readAsText(file, 'utf-8');
}

/* ---------------- Actions ---------------- */
async function saveReceipt(){
  const d = state.draft;
  if(!d.ownerName.trim()){ alert('กรุณากรอกชื่อเจ้าของสวน'); return; }
  const t = draftTotals(d);
  if(t.totalWeight<=0){ alert('กรุณาบันทึกน้ำหนักอย่างน้อย 1 เบอร์'); return; }

  const gradesSnapshot = d.grades.map(dg=>({name:dg.name, price:getGradePrice(dg.gradeId), entries:dg.entries.slice(), weight:gradeWeight(dg), amount:gradeAmount(dg)}));

  if(d.editingId){
    const idx = state.receipts.findIndex(x=>x.id===d.editingId);
    if(idx===-1){ alert('ไม่พบใบเสร็จที่ต้องการแก้ไข'); return; }
    const existing = state.receipts[idx];
    const updated = {
      ...existing,
      ownerName:d.ownerName.trim(), date:d.date, feePerKg:d.feePerKg,
      grades:gradesSnapshot,
      totalWeight:t.totalWeight, totalAmount:t.totalAmount, fee:t.fee, net:t.net,
      editedAt:Date.now()
    };
    state.receipts[idx] = updated;
    await saveReceiptsList();
    if(state.cloudUrl){ cloudPost({action:'updateReceipt', receipt:updated}).catch(e=>{ console.error('cloud update failed',e); showToastTemp('อัปเดตขึ้น Google Sheets ไม่สำเร็จ (บันทึกในเครื่องแล้ว)'); }); }
    resetDraft();
    state.viewId = updated.id;
    state.tab = 'detail';
    render();
    return;
  }

  const receipt = {
    id:uid(),
    receiptNo:state.config.nextReceiptNo||1,
    ownerName:d.ownerName.trim(),
    date:d.date,
    feePerKg:d.feePerKg,
    grades:gradesSnapshot,
    totalWeight:t.totalWeight, totalAmount:t.totalAmount, fee:t.fee, net:t.net,
    createdAt:Date.now()
  };
  state.receipts.push(receipt);
  state.config.nextReceiptNo = (state.config.nextReceiptNo||1) + 1;

  // Print first, before any 'await' - iOS Safari only allows window.print() to
  // open while still inside the synchronous call stack of the user's tap. Once
  // this function awaits anything, that activation is gone and print() would
  // silently do nothing. Saving to storage/cloud can safely happen after.
  resetDraft();
  doPrint(receipt);
  render();

  await saveReceiptsList();
  await saveConfig();
  if(state.cloudUrl){ cloudPost({action:'addReceipt', receipt}).catch(e=>{ console.error('cloud add failed',e); showToastTemp('บันทึกขึ้น Google Sheets ไม่สำเร็จ (บันทึกในเครื่องแล้ว)'); }); }
}

function startEditReceipt(id){
  const r = state.receipts.find(x=>x.id===id);
  if(!r) return;
  state.draft = {
    ownerName:r.ownerName,
    date:r.date,
    feePerKg:r.feePerKg,
    editingId:r.id,
    editingReceiptNo:r.receiptNo,
    grades:state.config.grades.map(g=>{
      const match = r.grades.find(rg=>rg.name===g.name);
      return {gradeId:g.id, name:g.name, entries: match? match.entries.slice() : []};
    })
  };
  state.tab = 'new';
  render();
}

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='tab'){
    state.tab = el.dataset.tab;
    if(state.tab==='new' && state.draft && !state.draft.editingId && !state.draft.ownerName && !state.draft.grades.some(g=>g.entries.length)){
      state.draft.date = todayLocalISO();
    }
    render();
    return;
  }
  if(action==='clearDraft'){ if(confirm('ล้างข้อมูลใบเสร็จปัจจุบัน?')){ resetDraft(); render(); } return; }
  if(action==='saveReceipt'){ await saveReceipt(); return; }
  if(action==='cancelEdit'){
    const id = state.draft.editingId;
    resetDraft();
    if(id){ state.viewId = id; state.tab = 'detail'; } else { state.tab = 'new'; }
    render();
    return;
  }
  if(action==='editReceipt'){ startEditReceipt(el.dataset.id); return; }

  if(action==='addEntry'){
    const gid = el.dataset.grade;
    const input = document.querySelector(`[data-entry-input="${gid}"]`);
    const v = parseFloat(input.value);
    if(!isNaN(v) && v>0){
      const dg = state.draft.grades.find(x=>x.gradeId===gid);
      dg.entries.push(v);
      input.value='';
      render();
      const again = document.querySelector(`[data-entry-input="${gid}"]`);
      if(again) again.focus();
    }
    return;
  }
  if(action==='rmEntry'){
    const gid = el.dataset.grade, idx = parseInt(el.dataset.idx);
    const dg = state.draft.grades.find(x=>x.gradeId===gid);
    dg.entries.splice(idx,1);
    render();
    return;
  }

  if(action==='histMode'){ state.historyMode = el.dataset.mode; render(); return; }
  if(action==='toggleDateFilter'){ state.showDateFilter = !state.showDateFilter; render(); return; }
  if(action==='clearDateFilter'){ state.filterFrom=''; state.filterTo=''; render(); return; }
  if(action==='viewReceipt'){ state.viewId = el.dataset.id; state.tab='detail'; render(); return; }
  if(action==='toggleSelectMode'){ state.selectMode = !state.selectMode; state.selectedIds = []; render(); return; }
  if(action==='selectAllVisible'){
    const visibleIds = getFilteredReceiptList().map(r=>r.id);
    const allSelected = visibleIds.length && visibleIds.every(id=>state.selectedIds.includes(id));
    state.selectedIds = allSelected ? [] : visibleIds;
    render();
    return;
  }
  if(action==='toggleSelect'){
    const id = el.dataset.id;
    const idx = state.selectedIds.indexOf(id);
    if(idx>-1) state.selectedIds.splice(idx,1); else state.selectedIds.push(id);
    render();
    return;
  }
  if(action==='printSelectedA4'){ await doPrintSelectedA4(state.selectedIds); return; }
  if(action==='backHistory'){ state.tab='history'; render(); return; }
  if(action==='printExisting'){
    const r = state.receipts.find(x=>x.id===el.dataset.id);
    if(r) doPrint(r);
    return;
  }
  if(action==='shareReceipt'){
    const r = state.receipts.find(x=>x.id===el.dataset.id);
    if(r) shareReceipt(r);
    return;
  }
  if(action==='printDaily'){ doPrintReport(el.dataset.date); return; }
  if(action==='exportCsv'){ exportCsv(el.dataset.date); return; }
  if(action==='printMonthly'){ doPrintMonthly(el.dataset.month); return; }
  if(action==='exportMonthlyCsv'){ exportMonthlyCsv(el.dataset.month); return; }
  if(action==='exportBackup'){ exportBackup(); return; }
  if(action==='saveCloudUrl'){
    const input = document.getElementById('cloudUrlInput');
    await saveCloudUrl(input.value);
    if(state.cloudUrl){ await syncFromCloud(); } else { render(); }
    return;
  }
  if(action==='syncNow'){
    if(!state.cloudUrl){ alert('กรุณาวางลิงก์ Web App แล้วกด "บันทึกลิงก์" ก่อน'); return; }
    await syncFromCloud();
    return;
  }
  if(action==='deleteReceipt'){
    if(confirm('ยืนยันการลบใบเสร็จนี้? ไม่สามารถกู้คืนได้')){
      const delId = el.dataset.id;
      state.receipts = state.receipts.filter(x=>x.id!==delId);
      await saveReceiptsList();
      if(state.cloudUrl){ cloudPost({action:'deleteReceipt', id:delId}).catch(e=>{ console.error('cloud delete failed',e); showToastTemp('ลบขึ้น Google Sheets ไม่สำเร็จ (ลบในเครื่องแล้ว)'); }); }
      state.tab='history'; render();
    }
    return;
  }

  if(action==='addGrade'){
    const input = document.getElementById('newGradeName');
    const name = input.value.trim();
    if(name){
      state.config.grades.push({id:uid(), name, price:0});
      await saveConfig();
      render();
    }
    return;
  }
  if(action==='rmGrade'){
    if(confirm('ลบเบอร์นี้ออกจากรายการ?')){
      state.config.grades = state.config.grades.filter(g=>g.id!==el.dataset.grade);
      await saveConfig();
      render();
    }
    return;
  }
});

document.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.matches('[data-entry-input]')){
    e.preventDefault();
    const gid = e.target.dataset.entryInput;
    const btn = document.querySelector(`[data-action="addEntry"][data-grade="${gid}"]`);
    if(btn) btn.click();
  }
  if(e.key==='Enter' && e.target.id==='newGradeName'){
    e.preventDefault();
    document.querySelector('[data-action="addGrade"]').click();
  }
});

document.addEventListener('input', (e)=>{
  const t = e.target;
  if(t.dataset.field==='ownerName'){ state.draft.ownerName = t.value; return; }
  if(t.dataset.field==='date'){ state.draft.date = t.value; return; }
  if(t.dataset.field==='feePerKg'){ state.draft.feePerKg = parseFloat(t.value)||0; refreshSummaryOnly(); return; }
  if(t.dataset.action==='search'){
    const cursorPos = t.selectionStart;
    state.search = t.value;
    render();
    const freshInput = document.querySelector('[data-action="search"]');
    if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(cursorPos, cursorPos); }
    return;
  }
  if(t.dataset.field==='filterFrom'){ state.filterFrom = t.value; render(); return; }
  if(t.dataset.field==='filterTo'){ state.filterTo = t.value; render(); return; }
  if(t.dataset.action==='reportDate'){ state.reportDate = t.value; render(); return; }
  if(t.dataset.action==='reportMonth'){ state.reportMonth = t.value; render(); return; }
  if(t.dataset.action==='gradeName'){
    const g = state.config.grades.find(x=>x.id===t.dataset.grade);
    if(g){ g.name = t.value; saveConfig(); }
    return;
  }
  if(t.dataset.action==='gradePrice'){
    const g = state.config.grades.find(x=>x.id===t.dataset.grade);
    if(g){ g.price = parseFloat(t.value)||0; saveConfig(); }
    return;
  }
  if(t.dataset.cfg==='memberNames'){
    state.config.memberNames = t.value.split(/[,\n]+/).map(s=>s.trim()).filter(Boolean);
    saveConfig();
    return;
  }
  if(t.dataset.cfg){
    const key=t.dataset.cfg;
    state.config[key] = (key==='feePerKg')? (parseFloat(t.value)||0) : t.value;
    saveConfig();
    return;
  }
});

// Lightweight partial refresh for price/fee inputs so focus isn't lost while typing
function refreshSummaryOnly(){
  const t = draftTotals(state.draft);
  const app = document.getElementById('app');
  const netEl = app.querySelector('.srow.net .val');
  if(netEl) netEl.textContent = fmtNum(t.net)+' บาท';
  const rows = app.querySelectorAll('.summary-card .srow .val');
  if(rows.length>=4){
    rows[0].textContent = fmtNum(t.totalWeight)+' กก.';
    rows[1].textContent = fmtNum(t.totalAmount)+' บาท';
    rows[2].textContent = fmtNum(t.fee)+' บาท';
  }
  document.querySelectorAll('.grade-row').forEach(row=>{
    const gid = row.dataset.grade;
    const dg = state.draft.grades.find(x=>x.gradeId===gid);
    if(!dg) return;
    const w = gradeWeight(dg), amt = gradeAmount(dg);
    const foot = row.querySelector('.grade-foot');
    if(foot){
      foot.children[0].innerHTML = `รวมน้ำหนัก <b class="num">${fmtNum(w)}</b> กก.`;
      foot.children[1].innerHTML = `จำนวนเงิน <b class="num">${fmtNum(amt)}</b> บาท`;
    }
    const tag = row.querySelector('.gname');
    if(tag) tag.innerHTML = `${escapeHtml(dg.name)}${w>0?`<span class="tag">${fmtNum(w)} กก.</span>`:''}`;
  });
}

document.addEventListener('change', (e)=>{
  // ensure final value committed (in case input listener missed a case, e.g. date picker)
  const t = e.target;
  if(t.dataset.field==='date'){ state.draft.date = t.value; }
  if(t.id==='backupFileInput' && t.files && t.files[0]){
    importBackupFile(t.files[0]);
    t.value = '';
  }
});

loadData();
</script>
